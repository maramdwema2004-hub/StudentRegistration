
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 650px;">

        <h2 class="text-center mb-4">Student Registration</h2>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">University ID</label>
                <input type="text" name="university_id" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">National ID</label>
                <input type="text" name="id_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobile_number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" maxlength="150" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Student Image</label>
                <input type="file" name="image" accept=".jpg,.jpeg,.png" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register Student
            </button>

            <a href="{% url 'student_list' %}" class="btn btn-secondary w-100 mt-2">
                View Students
            </a>

        </form>

    </div>
</div>

</body>
</html>
